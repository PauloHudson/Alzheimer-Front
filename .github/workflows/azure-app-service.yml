# Publica o front no Azure App Service (mxai-front) a cada push na main.
#
# Precisa do segredo AZURE_WEBAPP_PUBLISH_PROFILE no repositório (Settings →
# Secrets and variables → Actions), com o perfil de publicação do App Service.
name: Publicar no Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-service-front
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build com o backend real
        run: npm run build
        env:
          VITE_USE_MOCK: "false"
          VITE_API_URL: https://mxai-tcc4083.azurewebsites.net/api

      # O App Service serve o dist/ com `pm2 serve --spa` (comando de inicialização do app).
      - uses: azure/webapps-deploy@v3
        with:
          app-name: mxai-front
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
